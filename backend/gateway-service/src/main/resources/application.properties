spring.application.name=gateway-service
server.port=8083
spring.cloud.gateway.server.webmvc.enabled=true
# =========================
# Project Service
# =========================

spring.cloud.gateway.server.webmvc.routes[0].id=project-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/projects/**

# ===========================
# Workflow Service
# ===========================

spring.cloud.gateway.server.webmvc.routes[1].id=workflow-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/workflows/**


# ===========================
# WorkflowNode Service
# ===========================

spring.cloud.gateway.server.webmvc.routes[2].id=workflownode-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/workflow-nodes/**

jwt.secret=${JWTSECRET}
# =========================
# Auth Service
# =========================

spring.cloud.gateway.server.webmvc.routes[3].id=auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/auth/**