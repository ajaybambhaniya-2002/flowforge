spring.application.name=gateway-service
server.port=8083
spring.cloud.gateway.server.webmvc.enabled=true
# =========================
# Project Service
# =========================

spring.cloud.gateway.server.webmvc.routes[0].id=project-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/projects/**


jwt.secret=${JWTSECRET}
# =========================
# Auth Service
# =========================

spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/auth/**